[package]
name = "bokoni"
version = "0.1.0"
edition = "2024"
description = "Scripting language embedded in Rust, Ruby-like syntax, gradual typing"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bokoni"
path = "src/main.rs"

[dependencies]
cranelift-codegen = { version = "=0.136.2", optional = true }
cranelift-frontend = { version = "=0.136.2", optional = true }
cranelift-jit = { version = "=0.136.2", optional = true }
cranelift-module = { version = "=0.136.2", optional = true }
cranelift-native = { version = "=0.136.2", optional = true }
stacker = "0.1"

[profile.release]
debug = 1

[dev-dependencies]
peg = "0.8"

[features]
default = ["jit"]
# Native compilation of typed functions (Cranelift).
jit = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
]
