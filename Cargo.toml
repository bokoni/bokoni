[package]
name = "bokoni"
version = "0.1.0"
edition = "2024"
description = "Scripting language embedded in Rust, Ruby-like syntax, gradual typing"
# The browser playground is a separate crate and web project.
exclude = ["playground", "hosts"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "bokoni"
path = "src/main.rs"

[dependencies]
cranelift-codegen = { version = "=0.136.2", optional = true, default-features = false, features = ["std"] }
cranelift-frontend = { version = "=0.136.2", optional = true, default-features = false, features = ["std"] }
cranelift-jit = { version = "=0.136.2", optional = true }
cranelift-module = { version = "=0.136.2", optional = true, default-features = false, features = ["std"] }
cranelift-native = { version = "=0.136.2", optional = true }
serde = { version = "1", optional = true }
stacker = "0.1"
wasm-encoder = { version = "0.262", optional = true }
target-lexicon = { version = "0.13", optional = true }

[profile.release]
debug = 1

[dev-dependencies]
peg = "0.8"
serde_json = "1"

[features]
default = ["jit"]
# Native compilation of functions (Cranelift).
jit = [
    "clif",
    "dep:cranelift-jit",
    "dep:cranelift-native",
    "cranelift-codegen/host-arch",
    "cranelift-codegen/unwind",
    "cranelift-codegen/timing",
]
# The same compilation for Bokoni running in WebAssembly: its functions written as
# WebAssembly modules the host compiles (`wasm_jit`).
wasm-jit = ["clif", "dep:wasm-encoder", "dep:target-lexicon"]
# (The JIT's functions built in Cranelift's IR: both of the above.)
clif = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-module"]
# Serialization of script values (`Engine::serializable`), into any `serde` format.
serde = ["dep:serde"]
