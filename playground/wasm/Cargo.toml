[package]
name = "bokoni-playground"
version = "0.1.0"
edition = "2024"
description = "Bokoni compiled to WebAssembly for the browser playground"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Typed functions compiled to WebAssembly modules, instantiated by the page (`bk_compile`).
bokoni = { path = "../..", default-features = false, features = ["wasm-jit"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
