# Bokoni in wasmtime (`hosts/wasmtime`): the playground's module run as a native host
# would, its functions compiled to WebAssembly, under fuel and memory limits.

name: Hosts

on:
  push:
    branches: [main]
    paths:
      - "hosts/**"
      - "playground/wasm/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/hosts.yml"
  pull_request:
    paths:
      - "hosts/**"
      - "playground/wasm/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasmtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            playground/wasm
            hosts/wasmtime

      - run: cargo test --release
        working-directory: hosts/wasmtime
